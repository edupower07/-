<style>
/* =========================================
   自動車づくりにはげむ人々 学習サイト
   わくわく！ロードトリップ・デザイン（子ども向け）
   ========================================= */

/* ---- Google Fonts ---- */
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

/* ---- CSS変数 ---- */
:root {
  --blue:       #1565C0;
  --blue-dark:  #0D47A1;
  --blue-lt:    #E3F2FD;
  --orange:     #FF6F00;
  --orange-lt:  #FFF3E0;
  --green:      #2E7D32;
  --green-lt:   #E8F5E9;
  --purple:     #7B1FA2;
  --red:        #C62828;
  --yellow:     #F9A825;
  --bg:         #F0F4FF;
  --white:      #ffffff;
  --radius:     20px;
  --radius-sm:  12px;
  --shadow:     0 4px 20px rgba(21,101,192,.13);
  --shadow-lg:  0 8px 32px rgba(21,101,192,.20);
  --gray:       #546E7A;
}

/* ---- リセット ---- */
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ---- キーフレーム ---- */
@keyframes drive {
  0%   { transform: translateX(-120px); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateX(calc(100vw + 120px)); opacity: 0; }
}

@keyframes bounce-in {
  0%   { transform: scale(0.7) translateY(30px); opacity: 0; }
  60%  { transform: scale(1.05) translateY(-8px); opacity: 1; }
  80%  { transform: scale(0.97) translateY(3px); }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15%  { transform: translateX(-8px) rotate(-1deg); }
  30%  { transform: translateX(8px) rotate(1deg); }
  45%  { transform: translateX(-6px); }
  60%  { transform: translateX(6px); }
  75%  { transform: translateX(-3px); }
  90%  { transform: translateX(3px); }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 8px rgba(46,125,50,.4), 0 0 20px rgba(46,125,50,.2); }
  50%       { box-shadow: 0 0 20px rgba(46,125,50,.7), 0 0 40px rgba(46,125,50,.4); }
}

@keyframes stripe-move {
  0%   { background-position: 0 0; }
  100% { background-position: 40px 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-10px); }
}

@keyframes sparkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .6; transform: scale(1.15); }
}

@keyframes speed-line {
  0%   { transform: translateX(-100%) scaleX(0.3); opacity: 0; }
  30%  { opacity: .6; transform: translateX(-30%) scaleX(1); }
  100% { transform: translateX(200%) scaleX(0.3); opacity: 0; }
}

/* ---- ボディ ---- */
body {
  font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
  background: var(--bg);
  color: #1A237E;
  line-height: 1.75;
  font-size: 16px;
}

/* ---- ヘッダー ---- */
header {
  background: linear-gradient(135deg, #1565C0 0%, #0D47A1 40%, #1A237E 100%);
  color: #fff;
  padding: 0;
  position: relative;
  overflow: hidden;
}

header::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  animation: speed-line 3s ease-in-out infinite;
  transform: translateY(-50%);
}

header::after {
  content: '';
  position: absolute;
  top: 70%;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(249,168,37,.6), transparent);
  animation: speed-line 3s ease-in-out infinite 1s;
  transform: translateY(-50%);
}

.header-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 1;
}

.header-icon {
  font-size: 2.8rem;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.3));
}

.header-title h1 {
  font-size: 1.35rem;
  font-weight: 900;
  line-height: 1.25;
  text-shadow: 0 2px 8px rgba(0,0,0,.3);
  letter-spacing: .02em;
}

.header-title p {
  font-size: .82rem;
  opacity: .88;
  margin-top: 3px;
  font-weight: 700;
}

/* ---- ナビゲーション ---- */
nav {
  background: var(--blue-dark);
  border-bottom: 4px solid var(--yellow);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

nav::-webkit-scrollbar { display: none; }

.nav-inner {
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  padding: 8px 12px;
  min-width: max-content;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 8px 16px;
  font-size: .85rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
  border-radius: 30px;
  background: rgba(255,255,255,.12);
  border: 2px solid rgba(255,255,255,.2);
  white-space: nowrap;
  cursor: pointer;
}

nav a:hover {
  background: var(--orange);
  border-color: var(--orange);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255,111,0,.4);
}

nav a.active {
  background: var(--yellow);
  color: #1A237E;
  border-color: var(--yellow);
  font-weight: 900;
  box-shadow: 0 4px 12px rgba(249,168,37,.5);
}

/* ---- メインレイアウト ---- */
main {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 16px 70px;
}

/* ---- セクションタイトル ---- */
.section-title {
  font-size: 1.45rem;
  font-weight: 900;
  color: var(--blue);
  border-left: 6px solid var(--orange);
  padding: 6px 0 6px 16px;
  margin: 38px 0 18px;
  position: relative;
}

.section-title:first-child { margin-top: 0; }

.section-sub {
  font-size: 1.05rem;
  font-weight: 700;
  color: #333;
  margin: 24px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---- ヒーローバナー ---- */
.hero {
  background: linear-gradient(135deg, #1565C0 0%, #7B1FA2 50%, #0D47A1 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 40px 28px;
  margin-bottom: 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}

.hero::before {
  content: '🚗';
  position: absolute;
  font-size: 2.5rem;
  bottom: 12px;
  left: -60px;
  animation: drive 8s linear infinite;
}

.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,.08) 0%, transparent 60%);
  pointer-events: none;
}

.hero h2 {
  font-size: 1.9rem;
  margin-bottom: 10px;
  font-weight: 900;
  text-shadow: 0 3px 12px rgba(0,0,0,.3);
  animation: float 4s ease-in-out infinite;
  position: relative;
  z-index: 1;
}

.hero p {
  font-size: 1rem;
  opacity: .95;
  line-height: 1.8;
  position: relative;
  z-index: 1;
  font-weight: 700;
}

/* ---- カードグリッド ---- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform .25s, box-shadow .25s;
  animation: bounce-in .5s ease both;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

.card-header {
  padding: 16px 18px 12px;
  font-weight: 900;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.2);
}

.card-body {
  padding: 14px 18px 18px;
  font-size: .92rem;
  color: var(--gray);
}

.card-body p { margin-bottom: 7px; }

/* カラーバリアント（グラデーション） */
.card-blue   .card-header { background: linear-gradient(135deg, #1565C0, #0D47A1); }
.card-green  .card-header { background: linear-gradient(135deg, #2E7D32, #1B5E20); }
.card-orange .card-header { background: linear-gradient(135deg, #FF6F00, #E65100); }
.card-red    .card-header { background: linear-gradient(135deg, #C62828, #B71C1C); }
.card-purple .card-header { background: linear-gradient(135deg, #7B1FA2, #4A148C); }

/* ---- リンクカード（外部リソース用） ---- */
.resource-card {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  transition: transform .2s, box-shadow .2s;
}

.resource-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}

.resource-card a {
  text-decoration: none;
  color: inherit;
  display: flex;
  align-items: stretch;
  transition: background .2s;
  cursor: pointer;
}

.resource-card a:hover { background: var(--blue-lt); }

.resource-badge {
  min-width: 84px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 10px;
  font-size: .72rem;
  font-weight: 900;
  color: #fff;
  text-align: center;
  gap: 5px;
  letter-spacing: .02em;
}

.resource-badge .badge-icon { font-size: 1.7rem; }

/* バッジカラー */
.badge-nhk    { background: linear-gradient(135deg, #1565C0, #0D47A1); }
.badge-nissan { background: linear-gradient(135deg, #C62828, #B71C1C); }
.badge-toyota { background: linear-gradient(135deg, #eb0a1e, #B71C1C); }
.badge-jama   { background: linear-gradient(135deg, #2E7D32, #1B5E20); }
.badge-video  { background: linear-gradient(135deg, #424242, #212121); }
.badge-web    { background: linear-gradient(135deg, #7B1FA2, #4A148C); }
.badge-gov    { background: linear-gradient(135deg, #1A5276, #0E3460); }
.badge-jari   { background: linear-gradient(135deg, #117A65, #0B6652); }

.resource-info {
  padding: 13px 16px;
  flex: 1;
}

.resource-info strong {
  display: block;
  font-size: .95rem;
  color: #111;
  margin-bottom: 4px;
  font-weight: 700;
}

.resource-info small {
  font-size: .8rem;
  color: var(--gray);
  display: block;
}

.resource-arrow {
  display: flex;
  align-items: center;
  padding: 0 16px;
  color: var(--orange);
  font-size: 1.5rem;
  font-weight: 900;
}

/* ---- 動画埋め込み ---- */
.video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 */
  background: #000;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 8px;
  box-shadow: 0 0 0 3px var(--blue), 0 8px 24px rgba(21,101,192,.25);
}

.video-wrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
}

.video-caption {
  font-size: .8rem;
  color: var(--gray);
  text-align: center;
  margin-bottom: 20px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 22px;
  margin-bottom: 28px;
}

.video-item {}
.video-item h4 {
  font-size: .93rem;
  font-weight: 700;
  margin-bottom: 8px;
  color: #222;
}

/* ---- クイズ ---- */
.quiz-box {
  background: var(--white);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
  border: 2px solid #E3F2FD;
  position: relative;
  overflow: hidden;
}

.quiz-box::before {
  content: '🎮';
  position: absolute;
  right: 14px;
  top: 14px;
  font-size: 1.4rem;
  opacity: .25;
}

.quiz-q {
  font-weight: 900;
  font-size: 1.05rem;
  margin-bottom: 16px;
  color: #0D47A1;
  line-height: 1.6;
  padding-left: 44px;
  position: relative;
}

.quiz-q::before {
  content: 'Q';
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, var(--orange), #E65100);
  color: #fff;
  border-radius: 50%;
  font-size: 1rem;
  font-weight: 900;
  box-shadow: 0 3px 8px rgba(255,111,0,.4);
}

.quiz-options { display: flex; flex-direction: column; gap: 10px; }

.quiz-btn {
  background: var(--blue-lt);
  border: 2px solid #90CAF9;
  border-radius: 12px;
  padding: 12px 18px;
  text-align: left;
  cursor: pointer;
  font-size: .95rem;
  font-family: inherit;
  font-weight: 700;
  transition: all .18s;
  color: #1A237E;
}

.quiz-btn:hover {
  background: #BBDEFB;
  border-color: var(--blue);
  transform: translateX(4px);
  box-shadow: 0 3px 10px rgba(21,101,192,.2);
}

.quiz-btn.correct {
  background: var(--green-lt);
  border-color: var(--green);
  color: var(--green);
  animation: glow-pulse .6s ease;
}

.quiz-btn.wrong {
  background: #FFEBEE;
  border-color: var(--red);
  color: var(--red);
  animation: shake .5s ease;
}

.quiz-result {
  margin-top: 12px;
  font-size: .93rem;
  font-weight: 700;
  min-height: 1.5em;
  padding: 8px 12px;
  border-radius: 8px;
}

/* ---- タグ ---- */
.tag {
  display: inline-block;
  background: var(--blue-lt);
  color: var(--blue);
  border: 1.5px solid #90CAF9;
  border-radius: 20px;
  padding: 3px 12px;
  font-size: .77rem;
  font-weight: 700;
  margin: 2px;
}

/* ---- プロセスステップ ---- */
.steps {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  position: relative;
}

.step {
  flex: 1;
  min-width: 120px;
  background: var(--white);
  border-radius: var(--radius-sm);
  padding: 16px 10px;
  text-align: center;
  box-shadow: var(--shadow);
  position: relative;
  cursor: pointer;
  border: 3px solid transparent;
  transition: border-color .2s, transform .2s, box-shadow .2s;
}

.step:hover {
  border-color: var(--orange);
  transform: translateY(-4px) scale(1.03);
  box-shadow: var(--shadow-lg);
}

.step.active {
  border-color: var(--blue);
  background: var(--blue-lt);
}

.step-num {
  background: linear-gradient(135deg, var(--orange), #E65100);
  color: #fff;
  font-weight: 900;
  font-size: .85rem;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  box-shadow: 0 3px 8px rgba(255,111,0,.4);
}

.step-icon {
  font-size: 2.2rem;
  margin-bottom: 6px;
  display: block;
}

.step-name { font-size: .82rem; font-weight: 700; color: #333; }

.step-detail {
  background: linear-gradient(135deg, #E3F2FD, #E8F5E9);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin-bottom: 22px;
  border-left: 5px solid var(--blue);
  display: none;
  box-shadow: var(--shadow);
}

.step-detail.show { display: block; animation: bounce-in .3s ease; }
.step-detail h4 { font-size: 1.05rem; margin-bottom: 10px; color: var(--blue); font-weight: 900; }
.step-detail p  { font-size: .92rem; color: #444; }

/* ---- まとめボックス ---- */
.matome-box {
  background: linear-gradient(135deg, #E3F2FD 0%, #E8F5E9 100%);
  border-radius: var(--radius);
  padding: 20px 24px;
  border: 2px solid #90CAF9;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
}

.matome-box h3 {
  font-size: 1.05rem;
  margin-bottom: 12px;
  color: var(--blue);
  font-weight: 900;
}

.matome-box ul {
  padding-left: 1.5em;
  font-size: .93rem;
  color: #333;
}

.matome-box li { margin-bottom: 6px; }

/* ---- フッター ---- */
footer {
  background: linear-gradient(180deg, #0D47A1 0%, #091E57 100%);
  color: #B3C8F0;
  text-align: center;
  font-size: .8rem;
  padding: 24px 20px 16px;
  margin-top: 50px;
}

footer a { color: #90CAF9; }

footer::after {
  content: '🚗 🚕 🚙 🏎️ 🚐';
  display: block;
  font-size: 1.4rem;
  margin-top: 12px;
  letter-spacing: 8px;
  opacity: .7;
}

/* ---- レスポンシブ（タブレット・スマホ対応） ---- */
@media (max-width: 700px) {
  .header-title h1 { font-size: 1.05rem; }
  .header-icon { font-size: 2rem; }
  .hero h2 { font-size: 1.4rem; }
  .section-title { font-size: 1.15rem; }
  .card-grid { grid-template-columns: 1fr; }
  .video-grid { grid-template-columns: 1fr; }
  nav a { font-size: .78rem; padding: 7px 12px; }
}

@media (max-width: 400px) {
  .header-title h1 { font-size: .95rem; }
  .hero { padding: 28px 16px; }
  .hero h2 { font-size: 1.2rem; }
}

/* ---- 調べ学習メモ欄 ---- */
.memo-box {
  background: #fff;
  border: 3px dashed #90CAF9;
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
}

.memo-box label {
  display: block;
  font-size: .88rem;
  font-weight: 900;
  color: var(--blue);
  margin-bottom: 8px;
}

.memo-box textarea {
  width: 100%;
  min-height: 96px;
  border: 2px solid #90CAF9;
  border-radius: 10px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: .92rem;
  resize: vertical;
  color: #222;
  transition: border-color .2s;
}

.memo-box textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(21,101,192,.15);
}

/* ---- メモ保存ボタン ---- */
.memo-save {
  margin-top: 8px;
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 10px 26px;
  cursor: pointer;
  font-size: .92rem;
  font-weight: 700;
  font-family: inherit;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 4px 12px rgba(21,101,192,.35);
}

.memo-save:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(21,101,192,.5);
}

.memo-save:active {
  transform: translateY(1px);
  box-shadow: 0 2px 6px rgba(21,101,192,.3);
}

/* ---- 進捗バー（レーストラック風） ---- */
.progress-bar-wrap {
  background: #CFD8DC;
  border-radius: 30px;
  height: 22px;
  margin: 8px 0 20px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.15);
  border: 2px solid #B0BEC5;
}

.progress-bar {
  height: 100%;
  background:
    repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,.25) 0px,
      rgba(255,255,255,.25) 8px,
      transparent 8px,
      transparent 16px
    ),
    linear-gradient(90deg, var(--orange) 0%, var(--yellow) 60%, #FFD54F 100%);
  background-size: 40px 100%, 100% 100%;
  border-radius: 30px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
  animation: stripe-move .8s linear infinite;
  position: relative;
}

.progress-bar::after {
  content: '🚗';
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  line-height: 1;
}

/* ---- 注意ボックス ---- */
.note-box {
  background: linear-gradient(135deg, #FFF8E1, #FFF3E0);
  border-left: 5px solid var(--yellow);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 16px;
  font-size: .88rem;
  color: #555;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  position: relative;
}

.note-box::before {
  content: '💡';
  margin-right: 6px;
}

.note-box strong { color: var(--orange); }

/* ---- インタラクティブ要素 ---- */
a, button, [onclick], label[for],
.step, .country-card, .quiz-btn,
.resource-card a, .top-nav-card {
  cursor: pointer;
}

/* ---- トップページ ナビカード ---- */
.top-nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 18px;
  margin-bottom: 36px;
}

.top-nav-card {
